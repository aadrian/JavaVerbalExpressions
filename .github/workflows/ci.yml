name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 25]
    steps:
      - uses: actions/checkout@v5
      # JDK the tests run on
      - uses: actions/setup-java@v5
        id: test-jdk
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      # JDK the build runs on (bnd-maven-plugin needs 17+)
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Test
        run: ./mvnw -B -ntp test -Djvm="${{ steps.test-jdk.outputs.path }}/bin/java"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: maven
      - name: Build jar, sources and javadoc
        run: ./mvnw -B -ntp verify -Pdeployment -DskipTests -Dgpg.skip
