name: Release

# Push a tag (e.g. 1.9) to release that version.
# Repository secrets: CENTRAL_USERNAME, CENTRAL_TOKEN (Central Portal user token),
# GPG_PRIVATE_KEY (armored), GPG_PASSPHRASE.
# Without CENTRAL_TOKEN the upload to Maven Central is skipped;
# without GPG_PRIVATE_KEY signing is skipped.

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Set version from tag
        run: ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Build, sign and publish to Maven Central
        run: >-
          ./mvnw -B -ntp deploy -Pdeployment -DskipTests
          -Dgpg.skip=${{ secrets.GPG_PRIVATE_KEY == '' }}
          -DskipPublishing=${{ secrets.CENTRAL_TOKEN == '' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: target/*.jar

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jars
      - name: Create GitHub release
        if: ${{ !env.ACT }}
        run: gh release create "$GITHUB_REF_NAME" ./*.jar --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
